name: Publish to npm

on:
  push:
    branches:
      - main
      - stable-release
      - platform-alignment
    # Only publish-relevant inputs (anything that can alter dist/) trigger this pipeline; the dist-content
    # diff below still gates the actual publish. README-npm.md IS an input — prepare-package.mjs copies it to dist/README.md.
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'scripts/**'
      - '*.json'
      - '*.mjs'
      - '*.cjs'
      - '*.js'
      - 'tsconfig*.json'
      - 'vitest.config.ts'
      - 'README-npm.md'
      - '.github/workflows/publish.yml'

# Serialize publish runs per branch (audit B01-backend-legacy-04): two overlapping
# runs both read dist-tags, derive the same NEW_VERSION, and the loser fails at
# `npm publish` (duplicate version) or at the post-publish `git push` — after
# already publishing. Never cancel an in-flight publish; queue instead.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine release channel
        id: channel
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          if [ "$BRANCH" = "stable-release" ]; then
            echo "npm_tag=stable" >> $GITHUB_OUTPUT
            echo "is_stable=true" >> $GITHUB_OUTPUT
            echo "is_alignment=false" >> $GITHUB_OUTPUT
          elif [ "$BRANCH" = "platform-alignment" ]; then
            echo "npm_tag=alignment" >> $GITHUB_OUTPUT
            echo "is_stable=false" >> $GITHUB_OUTPUT
            echo "is_alignment=true" >> $GITHUB_OUTPUT
          else
            echo "npm_tag=latest" >> $GITHUB_OUTPUT
            echo "is_stable=false" >> $GITHUB_OUTPUT
            echo "is_alignment=false" >> $GITHUB_OUTPUT
          fi
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "Release channel: branch=$BRANCH"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org/'

      - name: Clean node_modules
        run: rm -rf node_modules

      - name: Clear npm cache
        run: npm cache clean --force

      - name: Install dependencies in the root folder
        # npm ci: reproducible install from the committed lockfile (supply-chain
        # pin, post-audit security-review follow-up). The dist-folder install
        # below stays npm install — dist/package.json is generated per-build
        # and has no lockfile by design.
        run: npm ci

      - name: Build npm package
        run: npm run build:package
        env:
          # tsc peaks >4GB compiling the full generated CRUD surface (grew with the
          # IR domain); the default Node heap OOMs here. Railway builds via the
          # Dockerfile (NODE_OPTIONS=--max-old-space-size=6144); match with headroom.
          NODE_OPTIONS: --max-old-space-size=8192

      # Quality gate (audit B01-backend-legacy-01): the publish flow previously ran
      # zero tests/lint before shipping @stable to npm — the branch the trading
      # engine consumes. Typecheck is enforced by the full `tsc` inside
      # `build:package` above (the job fails on any type error); this step adds the
      # lint and vitest gates. Runs AFTER the build because the vitest suite and
      # lint config resolve against `src/generated/**`, which is gitignored and only
      # exists post-codegen. Any failure here aborts the job before `npm publish`.
      - name: Quality gate (lint + unit tests)
        run: |
          npm run lint
          npm run test
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Install dependencies in dist folder
        working-directory: dist
        run: npm install --legacy-peer-deps

      - name: Set up Git user
        run: |
          git config --global user.name "mehran9"
          git config --global user.email "mgranfar@gmail.com"

      - name: Get package name and version
        id: package_info
        working-directory: dist
        run: |
          PACKAGE_NAME=$(jq -r .name package.json)
          PACKAGE_VERSION=$(jq -r .version package.json)
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_ENV
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV

      # Skip-if-unchanged gate (audit B01-backend-legacy-04). The previous
      # implementation was dead logic on THREE counts: (1) it compared npm tarball
      # listings (paths prefixed `package/`) against unprefixed `find` output, so
      # every line always differed; (2) the tarball listing was written to the
      # PARENT of the workspace while the compare step read it from the workspace
      # root, so `comm` compared against an empty stream; (3) the local listing was
      # taken AFTER `npm install` in dist/, so it always contained node_modules.
      # Net effect: diff_output was unconditionally true and every push published a
      # new version. This rewrite compares actual file CONTENT (diff -r) between
      # dist/ and the extracted published tarball, excluding node_modules,
      # package.json (carries the version bump), and package-lock.json (created by
      # the dist install, never published).
      - name: Get current package content from npm
        id: get_npm_package_content
        env:
          NPM_TAG: ${{ steps.channel.outputs.npm_tag }}
        run: |
          rm -rf npm_published_package && mkdir -p npm_published_package
          TARBALL_URL=$(npm view "$PACKAGE_NAME@$NPM_TAG" dist.tarball 2>/dev/null || echo "")
          if [ -n "$TARBALL_URL" ]; then
            curl -sL "$TARBALL_URL" | tar -xzf - -C npm_published_package
            echo "tarball_found=true" >> $GITHUB_OUTPUT
          else
            echo "No published version found for tag '$NPM_TAG', treating as first publish"
            echo "tarball_found=false" >> $GITHUB_OUTPUT
          fi

      - name: Compare dist content with published package
        id: compare_dist
        env:
          TARBALL_FOUND: ${{ steps.get_npm_package_content.outputs.tarball_found }}
        run: |
          if [ "$TARBALL_FOUND" != "true" ]; then
            echo "First publish for this tag — publishing."
            echo "diff_output=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          if diff -r -q \
               --exclude=node_modules \
               --exclude=package.json \
               --exclude=package-lock.json \
               dist npm_published_package/package > dist_diff.txt 2>&1; then
            echo "No content differences vs published package."
            echo "diff_output=false" >> $GITHUB_OUTPUT
          else
            echo "Content differences found vs published package:"
            head -50 dist_diff.txt
            echo "diff_output=true" >> $GITHUB_OUTPUT
          fi

      - name: Check always-build-npm flag
        id: check_always_build
        run: |
          ALWAYS_BUILD=$(jq -r '."always-build-npm" // false' package-npm.json)
          echo "always_build=$ALWAYS_BUILD" >> $GITHUB_OUTPUT

      - name: Determine if publish is necessary
        id: should_publish
        run: |
          if [ "${{ steps.compare_dist.outputs.diff_output }}" == "false" ] && [ "${{ steps.check_always_build.outputs.always_build }}" != "true" ]; then
            echo "No changes detected and always-build-npm is not true. Skipping publish."
            echo "should_publish=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected or always-build-npm is true. Proceeding with publish."
            echo "should_publish=true" >> $GITHUB_OUTPUT
          fi

      - name: Bump version if necessary
        id: bump_version
        if: steps.should_publish.outputs.should_publish == 'true'
        env:
          IS_STABLE: ${{ steps.channel.outputs.is_stable }}
          IS_ALIGNMENT: ${{ steps.channel.outputs.is_alignment }}
        run: |
          if [ "$IS_ALIGNMENT" = "true" ]; then
            # Alignment channel: prerelease derived from the stable base so it
            # never collides with (and always sorts below) the next stable patch.
            STABLE_VERSION=$(npm view "$PACKAGE_NAME" dist-tags.stable 2>/dev/null || echo "0.0.900")
            PATCH=$(echo "$STABLE_VERSION" | cut -d'.' -f3)
            NEW_VERSION="0.0.$((PATCH + 1))-alignment.${GITHUB_RUN_NUMBER}"
            echo "Alignment prerelease version: $NEW_VERSION (stable base $STABLE_VERSION)"
          elif [ "$IS_STABLE" = "true" ]; then
            # Stable channel: derive version from latest stable-tagged npm release
            STABLE_VERSION=$(npm view "$PACKAGE_NAME" dist-tags.stable 2>/dev/null || echo "")
            if [ -z "$STABLE_VERSION" ]; then
              NEW_VERSION="0.0.900"
              echo "No existing stable release found, starting at $NEW_VERSION"
            else
              PATCH=$(echo "$STABLE_VERSION" | cut -d'.' -f3)
              NEW_PATCH=$((PATCH + 1))
              NEW_VERSION="0.0.$NEW_PATCH"
              echo "Latest stable version is $STABLE_VERSION, bumping to $NEW_VERSION"
            fi
          else
            # Main channel: existing patch bump logic
            echo "Checking current version..."
            CURRENT_VERSION=$(jq -r .version package-npm.json)
            echo "Current version is $CURRENT_VERSION"
            cd dist
            NEW_VERSION=$(npm version patch --no-git-tag-version --allow-same-version | sed 's/^v//')
            cd ..
          fi

          echo "New version is $NEW_VERSION"

          # Update the version in package-npm.json
          jq --arg new_version "$NEW_VERSION" '.version=$new_version' package-npm.json > tmp.json && mv tmp.json package-npm.json
          echo "Updated package-npm.json to version $NEW_VERSION"

          # Update the version in dist/package.json
          jq --arg new_version "$NEW_VERSION" '.version=$new_version' dist/package.json > tmp.json && mv tmp.json dist/package.json
          echo "Updated dist/package.json to version $NEW_VERSION"

          # Ensure both files are staged for commit
          git add package-npm.json package-lock.json dist/package.json -f

          # Check for changes and commit if there are any
          if git diff-index --cached --quiet HEAD --; then
            echo "No changes to commit"
            exit 0
          else
            git commit -m "ci: bump version to $NEW_VERSION"
          fi

      - name: Publish package
        if: steps.should_publish.outputs.should_publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ steps.channel.outputs.npm_tag }}
        working-directory: dist
        run: |
          # Ensure compare-step artifacts are removed before publishing
          rm -rf ../npm_published_package ../dist_diff.txt
          echo "Publishing package..."
          echo "Registry URL: $(npm config get registry)"
          echo "Package name: $(jq -r .name package.json)"
          echo "Package version: $(jq -r .version package.json)"
          echo "NPM tag: $NPM_TAG"
          echo "NPM whoami: $(npm whoami || echo 'Not authenticated')"

          echo "Running: npm publish --access public --tag $NPM_TAG"
          npm publish --access public --tag "$NPM_TAG"

      - name: Remove dist/package.json after publish and push changes
        if: steps.should_publish.outputs.should_publish == 'true'
        env:
          BRANCH: ${{ steps.channel.outputs.branch }}
        run: |
          git rm dist/package.json
          git commit -m "ci: remove dist/package.json after publish"
          git push origin "HEAD:$BRANCH"
